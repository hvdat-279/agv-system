slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    resolution: 0.05
    max_laser_range: 10.0

    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.5
    map_update_interval: 0.1

    transform_publish_period: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    debug_logging: false
